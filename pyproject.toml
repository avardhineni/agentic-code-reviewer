[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-code-reviewer"
version = "0.1.0"
description = "LangGraph-powered Git diff reviewer with line-grounded security/error/test findings, partial-failure handling, and historical-bug evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2.0",
  "openai>=2.0,<4.0",
  "pydantic>=2.0,<3.0",
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
agentic-review = "agentic_code_reviewer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_code_reviewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
